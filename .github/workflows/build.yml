name: Build and Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

# GITHUB_TOKEN 需要 packages: write 才能推 ghcr；缺省时 Actions 不给这个权限
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component:
          - name: cp
            dockerfile: ControlPlane.Dockerfile
            context: .
            image: reverseproxy-cp
          - name: dp
            dockerfile: DataPlane.Dockerfile
            context: .
            image: reverseproxy-dp

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve image namespace
        id: namespace
        # ghcr 的镜像路径必须全小写，而 github.repository_owner 会保留账号大小写
        # （FFFirer -> fffirer），转换放在这里而不是硬编码，改名时不会悄悄指错仓库
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: extract_version
        run: |
          if [ "${{ github.ref_type }}" == "tag" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "VERSION=${TAG#v}" >> $GITHUB_ENV
          else
            TIMESTAMP=$(date +%Y%m%d%H%M%S)
            echo "VERSION=dev-${GITHUB_SHA:0:7}-${TIMESTAMP}" >> $GITHUB_ENV
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.component.context }}
          file: ${{ matrix.component.dockerfile }}
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.namespace.outputs.owner }}/${{ matrix.component.image }}:${{ env.VERSION }}
            ${{ env.REGISTRY }}/${{ steps.namespace.outputs.owner }}/${{ matrix.component.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

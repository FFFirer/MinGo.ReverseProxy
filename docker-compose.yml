version: '3.8'

services:
  migrate:
    image: registry.private.fffirer.top:9081/1mingo/reverseproxy-cp:latest
    build:
      context: .
      dockerfile: ControlPlane.Dockerfile
    container_name: min-go-migrate
    entrypoint: ["./efbundle", "--connection", "Data Source=/app/data/mingocp.db"]
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    volumes:
      - ./data:/app/data
    restart: "no"

  control-plane:
    image: registry.private.fffirer.top:9081/1mingo/reverseproxy-cp:latest
    build:
      context: .
      dockerfile: ControlPlane.Dockerfile
    container_name: min-go-control-plane
    ports:
      - "5000:5000"     # REST API
      - "5001:5001"     # gRPC
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - Kestrel__Endpoints__Http__Url=http://+:5000
      - Kestrel__Endpoints__Http__Protocols=Http1
      - Kestrel__Endpoints__gRPC__Url=http://+:5001
      - Kestrel__Endpoints__gRPC__Protocols=Http2
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/mingocp.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/healthz/ready"]
      interval: 15s
      timeout: 5s
      retries: 2
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  data-plane:
    image: registry.private.fffirer.top:9081/1mingo/reverseproxy-dp:latest
    build:
      context: .
      dockerfile: DataPlane.Dockerfile
    container_name: min-go-data-plane
    ports:
      - "8080:8080"     # HTTP 代理端口
      - "8443:8443"     # HTTPS 代理端口
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080;https://+:8443
      - ControlPlane__GrpcUrl=http://control-plane:5001
    depends_on:
      control-plane:
        condition: service_healthy
    restart: unless-stopped

  # frontend 服务已合并到 control-plane 中
  # 前端在 control-plane:5000 端口与 API 同源输出
  # 独立运行/调试仍可使用 frontend/min-go-console/Dockerfile:
  #   docker build -f frontend/min-go-console/Dockerfile -t fe-test frontend/min-go-console
  #   docker run -p 8081:80 fe-test

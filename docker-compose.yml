version: '3.8'

services:
  control-plane:
    build:
      context: .
      dockerfile: ControlPlane.Dockerfile
    container_name: min-go-control-plane
    ports:
      - "5000:5000"     # REST API
      - "5001:5001"     # gRPC
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - Kestrel__Endpoints__Http__Url=http://+:5000
      - Kestrel__Endpoints__Http__Protocols=Http1
      - Kestrel__Endpoints__gRPC__Url=http://+:5001
      - Kestrel__Endpoints__gRPC__Protocols=Http2
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/mingocp.db
    volumes:
      - cp-data:/app/data
    restart: unless-stopped

  data-plane:
    build:
      context: .
      dockerfile: DataPlane.Dockerfile
    container_name: min-go-data-plane
    ports:
      - "8080:8080"     # 代理端口
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ControlPlane__GrpcUrl=http://control-plane:5001
    depends_on:
      - control-plane
    restart: unless-stopped

  frontend:
    build:
      context: frontend/min-go-console
      dockerfile: Dockerfile
    container_name: min-go-frontend
    ports:
      - "80:80"
    depends_on:
      - control-plane
    restart: unless-stopped

volumes:
  cp-data:

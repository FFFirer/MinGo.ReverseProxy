version: '3.8'

# 这里的镜像由 GitHub Actions 构建并推到公开 ghcr（仓库为 public，包继承公开可见性，
# 匿名 docker pull 即可，不需要凭据）。Gitea 流水线仍推私有 registry
# registry.private.fffirer.top:9081/1mingo/*，两条产物并行，按部署侧网络可达性选择。
services:
  migrate:
    image: ghcr.io/fffirer/reverseproxy-cp:latest
    build:
      context: .
      dockerfile: ControlPlane.Dockerfile
    container_name: min-go-migrate
    entrypoint: ["./efbundle", "--connection", "Data Source=/app/data/mingocp.db"]
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    volumes:
      - ./data:/app/data
    restart: "no"

  control-plane:
    image: ghcr.io/fffirer/reverseproxy-cp:latest
    build:
      context: .
      dockerfile: ControlPlane.Dockerfile
    container_name: min-go-control-plane
    ports:
      - "5000:5000"     # REST API
      - "5001:5001"     # gRPC
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - Kestrel__Endpoints__Http__Url=http://+:5000
      - Kestrel__Endpoints__Http__Protocols=Http1
      - Kestrel__Endpoints__gRPC__Url=http://+:5001
      - Kestrel__Endpoints__gRPC__Protocols=Http2
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/mingocp.db
      - OpenTelemetry__Enabled=true
      - OpenTelemetry__OtlpEndpoint=http://aspire-dashboard:4317
      # 数据面接入认证（可选）：配置后所有数据面 gRPC 连接必须携带匹配密钥，
      # 5001 端口对外暴露时强烈建议启用。数据面侧对应 ControlPlane__SharedSecret。
      #   DataPlane__SharedSecrets__0=change-me
      # 隧道回源地址：由 cloudflared 在它自己的网络命名空间解析，必须是连接器可达的地址。
      # 容器名（默认 http://data-plane:8080）只在 cloudflared 加入本 compose 网络时成立；
      # 连接器跑在宿主机或另一台机器时改用宿主地址 + 发布端口，按隧道名逐条覆盖：
      #   Cloudflare__TunnelOrigins__0__TunnelName=home
      #   Cloudflare__TunnelOrigins__0__Origin=http://192.168.88.134:8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/healthz/ready"]
      interval: 15s
      timeout: 5s
      retries: 2
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
      aspire-dashboard:
        condition: service_started
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  data-plane:
    image: ghcr.io/fffirer/reverseproxy-dp:latest
    build:
      context: .
      dockerfile: DataPlane.Dockerfile
    container_name: min-go-data-plane
    ports:
      - "8080:8080"     # HTTP 代理端口（已配证书的域名会 308 跳转到 8443）
      - "8443:8443"     # HTTPS 代理端口
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # ASPNETCORE_URLS 决定监听的 socket；HttpsRedirect:Port（默认 8443）只决定 Location 里的对外端口
      - ASPNETCORE_URLS=http://+:8080;https://+:8443
      - ControlPlane__GrpcUrl=http://control-plane:5001
      - OpenTelemetry__OtlpEndpoint=http://aspire-dashboard:4317
      # 与控制面 DataPlane__SharedSecrets 配套（控制面配置后必填）：
      #   ControlPlane__SharedSecret=change-me
      # Agent 固定身份（不填则持久化到 /app/data/agent-id，重启不变）：
      #   Agent__Id=local-1
      #   Agent__Name=local-1
      # ForwardedHeaders: 前置 TLS 终结层（Cloudflare Tunnel 等）场景
      # KnownProxies/KnownNetworks 为空 = 信任所有来源的转发头
      # 若需限制来源，配置具体 IP 或网段，如：
      #   ForwardedHeaders__KnownProxies__0=172.16.0.1
      #   ForwardedHeaders__KnownNetworks__0=10.0.0.0/8
    depends_on:
      control-plane:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started
    volumes:
      # Agent 身份状态文件（agent-id）与 CP 的 mingocp.db 同目录不同文件，共用挂载即可
      - ./data:/app/data
    restart: unless-stopped

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.0
    container_name: min-go-aspire-dashboard
    environment:
      - DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS=true
    ports:
      - "18888:18888"   # Dashboard UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    restart: unless-stopped

  # frontend 服务已合并到 control-plane 中
  # 前端在 control-plane:5000 端口与 API 同源输出
  # 独立运行/调试仍可使用 frontend/min-go-console/Dockerfile:
  #   docker build -f frontend/min-go-console/Dockerfile -t fe-test frontend/min-go-console
  #   docker run -p 8081:80 fe-test

name: Build and Release

on:
  release:
    types: [published, prereleased, released]
  workflow_dispatch:

env:
  CONTAINER_REGISTRY: ${{ vars.DOCKER_REGISTRY }}
  CONTAINER_REGISTRY_USERNAME: ${{ vars.DOCKER_USERNAME }}
  CONTAINER_REGISTRY_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component:
          - name: cp
            dockerfile: ControlPlane.Dockerfile
            context: .
            image: reverseproxy-cp
          - name: dp
            dockerfile: DataPlane.Dockerfile
            context: .
            image: reverseproxy-dp

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["https://docker.xuanyuan.me", "https://docker.1ms.run"]

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ env.CONTAINER_REGISTRY_USERNAME }}
          password: ${{ env.CONTAINER_REGISTRY_PASSWORD }}

      - name: Extract version from tag
        id: extract_version
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            echo "VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
          else
            TIMESTAMP=$(date +%Y%m%d%H%M%S)
            echo "VERSION=dev-${GITHUB_SHA:0:7}-${TIMESTAMP}" >> $GITHUB_ENV
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.component.context }}
          file: ${{ matrix.component.dockerfile }}
          push: true
          tags: |
            ${{ env.CONTAINER_REGISTRY }}/1mingo/${{ matrix.component.image }}:${{ env.VERSION }}
            ${{ env.CONTAINER_REGISTRY }}/1mingo/${{ matrix.component.image }}:latest
